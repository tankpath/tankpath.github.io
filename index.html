        <h1>TankPath</h1>
        <p>TankPath（タンクパス）は、壁への弾の反射・地雷の設置・戦略的な移動を駆使して敵タンクを撃破するブラウザ戦略アクションゲームです。全100ステージのソロミッション、仲間と協力するチームミッション、スコアを競うレースモード、プレイヤー同士が戦うバトルモードの4つのモードを搭載しています。PCのマウス・キーボード、スマートフォンのタップ操作の両方に対応しており、誰でも気軽に遊べます。</p>
        <p>TankPath is a browser-based strategic action game where you deflect bullets off walls, plant mines, and outmaneuver enemy tanks. With 100 solo stages, cooperative team play, competitive race mode, and player-vs-player battle mode, there is something for every type of player. Fully playable on PC with mouse and keyboard, or on smartphones via touch controls.</p>

        <h2>操作方法 / Controls</h2>
        <h3>移動 / Movement</h3>
        <p>キーボードの W・A・S・D キーでタンクを移動できます。スマートフォンでは画面上の十字ボタンをタップしてください。Use W/A/S/D on keyboard to move your tank. On smartphones, use the on-screen D-Pad.</p>
        <h3>照準・発射 / Aiming &amp; Shooting</h3>
        <p>マウスを動かして照準を合わせ、左クリックで発射します。スマートフォンでは攻撃したい方向をタップしてください。Move the mouse to aim the turret and left-click to fire. On smartphones, tap the direction you want to shoot.</p>
        <h3>地雷設置 / Mine Placement</h3>
        <p>右クリックでタンクの足もとに地雷を設置します。スマートフォンでは地雷ボタン（X ボタン）をタップしてください。Right-click to place a mine under your tank. On smartphones, tap the mine button.</p>

        <h2>ゲームモード / Game Modes</h2>
        <h3>ソロミッション / Solo Mission</h3>
        <p>全100ステージを一人でクリアするメインモードです。敵タンクをすべて倒すとステージクリア。自機が破壊されると敗北となります。挑戦回数は初期値5回で、5の倍数ステージをクリアするたびに1回増加します。敗北のたびに1回減少し、0になるとはじめからやり直しです。The main single-player campaign with 100 stages. Destroy all enemy tanks to clear each stage. You start with 5 lives; earn one extra life every time you clear a stage that is a multiple of 5.</p>
        <h3>チームモード / Team Mode</h3>
        <p>複数のプレイヤーとソロミッションのステージを協力してクリアするモードです。チーム全員が全滅すると挑戦回数が1減ります。Take on Solo Mission stages cooperatively with friends. The try count decreases by 1 if the entire team is wiped out.</p>
        <h3>レースモード / Race Mode</h3>
        <p>選択したステージで制限時間内に最も多くの敵タンクを撃破したプレイヤーの勝利です。タンクは自由に選択できます。Compete to destroy the most enemy tanks on a chosen stage. The player with the highest kill count wins. Tanks are freely selectable.</p>
        <h3>バトルモード / Battle Mode</h3>
        <p>敵AIなしのプレイヤー同士の対戦モードです。最後の1人になったプレイヤーが勝者となります。タンクは自由に選択できます。Pure player-vs-player combat with no AI enemies. The last player standing wins. Tanks are freely selectable.</p>

        <h2>弾の種類 / Shell Types</h2>
        <ul>
          <li><strong>通常弾 / Standard Shell</strong>：赤いビーム。壁に1回だけ反射する。耐久値1。Red beam. Reflects off walls once. Durability: 1.</li>
          <li><strong>強化弾 / Enhanced Shell</strong>：緑のビーム。壁に何度でも反射し続ける。やや速い。耐久値1。Green beam. Reflects off walls multiple times. Slightly faster. Durability: 1.</li>
          <li><strong>分裂弾 / Split Shell</strong>：黄色いビーム。壁への反射後に複数の弾に分裂する。速度は遅い。耐久値2。Yellow beam. Splits into multiple shells after bouncing. Slow speed. Durability: 2.</li>
          <li><strong>徹甲弾 / Armor-Piercing Shell</strong>：青いビーム。特定の壁を貫通する。反射なし。速い。耐久値4。Blue beam. Pierces through certain walls. No reflection. Fast. Durability: 4.</li>
        </ul>
        <p>弾同士がぶつかると互いの耐久値を削り合い、0になった弾は消えます。When two shells collide, each loses durability equal to the other's value; a shell reaching 0 is destroyed.</p>

        <h2>地雷の種類 / Mine Types</h2>
        <ul>
          <li><strong>広域地雷 / Area Mine</strong>：近くのタンクまたは弾に反応して爆発します。遠くから弾で起爆させることも可能です。Detonates when any nearby tank or shell enters its range. Can be triggered remotely by shooting it.</li>
          <li><strong>選択地雷 / Selective Mine</strong>：近くのタンクにのみ反応します。弾では起爆しません。敵の通り道に仕掛けるのが効果的です。Only reacts to tanks. Shells will not trigger it. Best placed on enemy patrol paths.</li>
        </ul>
